<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles/filtered-temples.css">

            <button id="menu-button"

            </button>

            <nav id="navigation">

                <a href="#" data-filter="old">Old</a>

    <main>

    <footer>
