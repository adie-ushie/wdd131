<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Thank you for submitting your product review.">
    <meta name="author" content="Adie G. Ushie">
    <title>Review Submitted | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Thank You!</h1>
    </header>

    <main>
        <section class="confirmation">
            <h2>Your Review Has Been Submitted</h2>
            <p>Thank you for taking the time to share your product experience.</p>
            <p>You have completed <strong id="reviewCount">0</strong> product reviews.</p>
            <p><a href="form.html">Submit Another Review</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Adie G. Ushie | Nigeria</p>
        <p>WDD 131 - Dynamic Web Fundamentals</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let reviewCount = Number(localStorage.getItem("reviewCount")) || 0;
        reviewCount++;
        localStorage.setItem("reviewCount", reviewCount);

        document.querySelector("#reviewCount").textContent = reviewCount;
    </script>
</body>
</html>
